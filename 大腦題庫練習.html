<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Microsoft JhengHei", Arial, sans-serif;
  background: linear-gradient(135deg, #f0f4ff, #e2ecff);
  margin: 0;
  padding: 20px;
  padding-top: 80px;
  color: #222;
}

/* 導覽列 */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 12px 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: rgba(20, 20, 40, 0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #393455;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  z-index: 1000;
}

.navbar a {
  color: #e7e0ff;
  text-decoration: none;
  padding: 10px 16px;
  background: linear-gradient(135deg, #302b50, #25233c);
  border: 1px solid #49436d;
  border-radius: 10px;
  font-size: 14px;
  transition: 0.25s;
}

.navbar a:hover {
  background: linear-gradient(135deg, #7663d9, #4c78dc);
  color: white;
  transform: translateY(-2px);
}

/* 主容器 */
.container {
  max-width: 720px;
  margin: 0 auto;
  background: white;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
}

h1 {
  text-align: center;
  color: #2c3e50;
  margin-top: 0;
  margin-bottom: 24px;
  font-size: 26px;
}

/* 設定區 */
.setup-group {
  margin-bottom: 20px;
}

.setup-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 16px;
  color: #34495e;
}

select {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 2px solid #cbd5e1;
  background: #f8fafc;
  font-family: inherit;
}

.btn-primary {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #4a7dff, #2f5ee0);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 10px;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(74, 125, 255, 0.4);
}

/* 測驗進行區 */
.hidden {
  display: none !important;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-weight: bold;
  color: #64748b;
}

.badge {
  background: #e0e7ff;
  color: #3730a3;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
}

.progress-bar-bg {
  width: 100%;
  height: 10px;
  background: #e2e8f0;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-bar-fill {
  height: 100%;
  background: #4a7dff;
  width: 0%;
  transition: width 0.3s ease;
}

.question-card {
  background: #f8fafc;
  border: 2px solid #e2e8f0;
  border-radius: 14px;
  padding: 28px 20px;
  text-align: center;
  margin-bottom: 24px;
}

.q-name {
  font-size: 22px;
  font-weight: bold;
  color: #1e293b;
  margin-bottom: 10px;
}

.q-text {
  font-size: 20px;
  color: #475569;
}

.answer-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.ans-btn {
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
  border-radius: 12px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: 0.2s;
}

.btn-true {
  background: #dcfce7;
  color: #166534;
  border-color: #86efac;
}

.btn-true:hover:not(:disabled) {
  background: #bbf7d0;
  transform: translateY(-2px);
}

.btn-false {
  background: #fee2e2;
  color: #991b1b;
  border-color: #fca5a5;
}

.btn-false:hover:not(:disabled) {
  background: #fecaca;
  transform: translateY(-2px);
}

.ans-btn:disabled {
  cursor: not-allowed;
  opacity: 0.85;
}

.feedback-box {
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.fb-correct {
  background: #dcfce7;
  color: #15803d;
  border: 1px solid #86efac;
}

.fb-wrong {
  background: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
}

/* 結算區 */
.score-display {
  text-align: center;
  padding: 20px;
  background: #f1f5f9;
  border-radius: 14px;
  margin-bottom: 20px;
}

.score-number {
  font-size: 42px;
  font-weight: bold;
  color: #2f5ee0;
}

.wrong-list {
  margin-top: 20px;
}

.wrong-item {
  background: #fff5f5;
  border-left: 4px solid #ef4444;
  padding: 12px 15px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.result-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.btn-secondary {
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  color: #334155;
  background: #e2e8f0;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.btn-secondary:hover {
  background: #cbd5e1;
}

/* 📱 手機自適應 */
@media (max-width: 600px) {
  body {
    padding: 12px;
    padding-top: 95px;
  }
  .container {
    padding: 18px;
  }
  h1 {
    font-size: 22px;
  }
  .navbar {
    padding: 8px;
    gap: 6px;
  }
  .navbar a {
    padding: 8px 10px;
    font-size: 12px;
  }
  .answer-buttons, .result-actions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

</div>

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongQuestions = [];

// 洗牌演算法（隨機打亂題目順序）
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 開始測驗
function startQuiz(isRetryWrong) {
  if (isRetryWrong && wrongQuestions.length > 0) {
    currentQuestions = shuffleArray(wrongQuestions);
  } else {
    const category = document.getElementById("categorySelect").value;
    const count = parseInt(document.getElementById("countSelect").value, 10);

    let filtered = category === "all" 
      ? quizData 
      : quizData.filter(q => q.type === category);

    currentQuestions = shuffleArray(filtered).slice(0, count);
  }

  currentIndex = 0;
  score = 0;
  wrongQuestions = [];

  document.getElementById("setupScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  renderQuestion();
}

// 顯示當前題目
function renderQuestion() {
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;

  document.getElementById("progressText").textContent = `第 ${currentIndex + 1} / ${total} 題`;
  document.getElementById("categoryBadge").textContent = q.type || "綜合";
  document.getElementById("progressBar").style.width = `${((currentIndex) / total) * 100}%`;

  document.getElementById("qName").textContent = q.name;
  document.getElementById("qText").textContent = q.question;

  // 重置按鈕與回饋狀態
  document.getElementById("btnTrue").disabled = false;
  document.getElementById("btnFalse").disabled = false;
  document.getElementById("feedbackBox").classList.add("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
}

// 提交答案
function submitAnswer(userChoice) {
  const q = currentQuestions[currentIndex];
  const isCorrect = (userChoice === q.answer);

  document.getElementById("btnTrue").disabled = true;
  document.getElementById("btnFalse").disabled = true;

  const fbBox = document.getElementById("feedbackBox");
  fbBox.classList.remove("hidden", "fb-correct", "fb-wrong");

  if (isCorrect) {
    score++;
    fbBox.classList.add("fb-correct");
    fbBox.textContent = `🎉 答對了！正確答案就是 ${q.answer}`;
  } else {
    wrongQuestions.push(q);
    fbBox.classList.add("fb-wrong");
    fbBox.textContent = `❌ 答錯囉！正確答案應該是 ${q.answer}`;
  }

  document.getElementById("progressBar").style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;
  
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "查看測驗結果 ➔" : "下一題 ➔";
  nextBtn.classList.remove("hidden");
}

// 切換下一題或進入結算
function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

// 顯示結算與錯題
function showResult() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  const total = currentQuestions.length;
  const finalScore = Math.round((score / total) * 100);

  document.getElementById("scoreText").textContent = `${finalScore} 分`;
  document.getElementById("detailText").textContent = `共 ${total} 題，答對 ${score} 題，答錯 ${wrongQuestions.length} 題`;

  const wrongSection = document.getElementById("wrongSection");
  const wrongContainer = document.getElementById("wrongListContainer");
  const retryBtn = document.getElementById("retryWrongBtn");

  wrongContainer.innerHTML = "";

  if (wrongQuestions.length > 0) {
    wrongSection.classList.remove("hidden");
    retryBtn.classList.remove("hidden");

    wrongQuestions.forEach(q => {
      const div = document.createElement("div");
      div.className = "wrong-item";
      div.innerHTML = `<strong>${q.name}</strong> ${q.question} <span style="float:right; font-weight:bold;">正解：${q.answer}</span>`;
      wrongContainer.appendChild(div);
    });
  } else {
    wrongSection.classList.add("hidden");
    retryBtn.classList.add("hidden");
  }
}

// 返回設定畫面
function resetToSetup() {
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("setupScreen").classList.remove("hidden");
}
