<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>明信片圖鑑</title>

<style>

*{
  box-sizing:border-box;
}
h1 {
  text-align: center;
  margin: 50px 0;
  font-size: 28px;
  color:White;
}
body{
  margin:0;
  padding:20px;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:#171525;
}
.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#333;
  padding:10px;
  display:flex;
  gap:10px;
  z-index:1000;
}

.navbar a{
  color:white;
  text-decoration:none;
  padding:8px 14px;
  background:#555;
  border-radius:6px;
}

.navbar a:hover{
  background:#777;
}
/* 圖片展示區 */

.imageGrid{
  max-width:1400px;
  margin:auto;

  display:grid;

  /* 一行3張 */
  grid-template-columns:repeat(3,1fr);

  gap:20px;
}

/* 圖片 */

.galleryImage{
  width:100%;
  height:250px;

  object-fit:contain;

  background:#211e2b;

  cursor:pointer;

  transition:.2s;

  border-radius:10px;
}

  
.galleryImage:hover{
  transform:scale(1.03);
}


/* 放大圖片 */

.imageViewer{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.9);

  z-index:9999;

  align-items:center;
  justify-content:center;

  padding:20px;

  cursor:pointer;
}

.viewerImage{

  max-width:95%;
  max-height:95%;

  object-fit:contain;

  border-radius:10px;

  cursor:default;
}

/* 手機 */

@media(max-width:600px){

  body{
    padding:10px;
  }

  .imageGrid{

    /* 手機一行2張 */
    grid-template-columns:repeat(2,1fr);

    gap:8px;
  }

  .galleryImage{
    height:180px;
  }

}
</style>

</head>

<body>


<!-- =========================
     圖片展示
========================= -->
<h1>🖼️ 明信片圖鑑</h1>
<div id="imageGrid" class="imageGrid"></div>
<div class="navbar">
  <a href="https://aakemon6634.github.io/%E8%81%96%E5%9C%98%E5%95%8F%E7%AD%94.HTML">聖團答題</a>
  <a href="https://aakemon6634.github.io/%E5%A4%A7%E8%85%A6%E9%A1%8C%E5%BA%AB.html">風國大腦題庫</a>
  <a href="https://aakemon6634.github.io/%E8%AD%B7%E9%80%81%E6%98%8E%E4%BF%A1%E7%89%87%E5%9C%96%E9%91%91.html">護送明信片圖鑑</a>
</div>

<!-- =========================
     圖片放大查看
========================= -->

<div
  id="imageViewer"
  class="imageViewer"
  onclick="closeImage()"
>

  <img
    id="viewerImage"
    class="viewerImage"
    onclick="event.stopPropagation()"
  >

</div>


<script>

/* =========================
   圖片資料
========================= */

const images = [

  "圖/p1.png",
  "圖/p2.png",
  "圖/P3.png",
  "圖/P4.png",
  "圖/P5.png",

];


/* =========================
   顯示圖片
========================= */

const imageGrid =
  document.getElementById("imageGrid");


images.forEach(src => {

  const img =
    document.createElement("img");

  img.className="galleryImage";

  img.src=src;

  img.onclick=()=>{

    showImage(src);

  };

  imageGrid.appendChild(img);

});


/* =========================
   放大圖片
========================= */

function showImage(src){

  const viewer =
    document.getElementById("imageViewer");

  const image =
    document.getElementById("viewerImage");

  image.src=src;

  viewer.style.display="flex";

}


/* =========================
   關閉
========================= */

function closeImage(){

  document.getElementById(
    "imageViewer"
  ).style.display="none";

}


/* ESC 關閉 */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Escape"){

      closeImage();

    }

  }
);

</script>

</body>

</html>
