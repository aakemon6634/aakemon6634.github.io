<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>明信片圖鑑</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 80px 20px 30px;
  font-family: "Microsoft JhengHei", Arial, sans-serif;
  background:
    radial-gradient(ellipse at top, #252344 0%, #171525 55%, #10101b 100%);
  color: #f4f0ff;
  min-height: 100vh;
}

/* 標題 */
h1 {
  text-align: center;
  margin: 25px 0 35px;
  font-size: 34px;
  letter-spacing: 3px;
  color: #e5d8ff;
  text-shadow: 0 0 18px rgba(164, 126, 255, 0.5);
}

/* 導覽列 */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 12px 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: rgba(20, 20, 40, 0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #393455;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  z-index: 1000;
}
/* 導覽列按鈕 */
.navbar a {
  color: #e7e0ff;
  text-decoration: none;
  padding: 10px 16px;
  background: linear-gradient(135deg, #302b50, #25233c);
  border: 1px solid #49436d;
  border-radius: 10px;
  font-size: 14px;
  transition: 0.25s;
}
/* 滑鼠移上去的效果 */
.navbar a:hover {
  background: linear-gradient(135deg, #7663d9, #4c78dc);
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 4px 15px #7663d955;
}

/* 圖片網格 */
.imageGrid {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

/* 每張圖片卡片 */
.imageCard {
  padding: 10px;
  text-align: center;
  background: linear-gradient(145deg, #24223a, #1b1a2b);
  border: 1px solid #484265;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  transition: transform 0.25s, border-color 0.25s,
              box-shadow 0.25s;
}

.imageCard:hover {
  transform: translateY(-5px);
  border-color: #a995ff;
  box-shadow: 0 10px 28px rgba(133, 106, 255, 0.2);
}

/* 圖片 */
.galleryImage {
  display: block;
  width: 100%;
  height: 250px;
  object-fit: contain;
  background: #12121f;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.25s;
}

.galleryImage:hover {
  filter: brightness(1.08);
}

/* 圖片名稱 */
.imageName {
  margin: 13px 0 5px;
  font-size: 17px;
  font-weight: bold;
  color: #eee7ff;
  letter-spacing: 1px;
  overflow-wrap: anywhere;
}

/* 放大圖片背景 */
.imageViewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(7, 7, 18, 0.94);
  backdrop-filter: blur(8px);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: pointer;
}

/* 放大的圖片 */
.viewerImage {
  max-width: 95%;
  max-height: 90%;
  object-fit: contain;
  border-radius: 12px;
  border: 1px solid #7770a8;
  box-shadow: 0 0 35px rgba(137, 113, 255, 0.2);
  cursor: default;
}

/* 手機 */
@media (max-width: 600px) {
  body {
    padding: 75px 10px 20px;
  }

  h1 {
    font-size: 25px;
    margin: 25px 0;
    letter-spacing: 1px;
  }

  .navbar {
    padding: 8px;
    gap: 6px;
  }

  .navbar a {
    padding: 8px 10px;
    font-size: 12px;
  }

  .imageGrid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .imageCard {
    padding: 6px;
    border-radius: 12px;
  }

  .galleryImage {
    height: 160px;
  }

  .imageName {
    margin-top: 9px;
    font-size: 14px;
  }
}
</style>

</head>

<body>


<!-- =========================
     圖片展示
========================= -->
<h1>🖼️ 明信片圖鑑</h1>
<div id="imageGrid" class="imageGrid"></div>
<div class="navbar">
  <a href="https://aakemon6634.github.io/%E8%81%96%E5%9C%98%E5%95%8F%E7%AD%94.HTML">聖團答題</a>
  <a href="https://aakemon6634.github.io/%E5%A4%A7%E8%85%A6%E9%A1%8C%E5%BA%AB.html">風國大腦題庫</a>
  <a href="https://aakemon6634.github.io/%E8%AD%B7%E9%80%81%E6%98%8E%E4%BF%A1%E7%89%87%E5%9C%96%E9%91%91.html">護送明信片圖鑑</a>
</div>

<!-- =========================
     圖片放大查看
========================= -->

<div
  id="imageViewer"
  class="imageViewer"
  onclick="closeImage()"
>

  <img
    id="viewerImage"
    class="viewerImage"
    onclick="event.stopPropagation()"
  >

</div>


<script>

/* =========================
   圖片資料
========================= */

const images = [
  { src: "圖/p1.png", name: "" },
  { src: "圖/p2.png", name: "" },
  { src: "圖/p3.png", name: "" },
  { src: "圖/p4.png", name: "" },
  { src: "圖/p5.png", name: "" },
  { src: "圖/p6.png", name: "意外福利" },
  { src: "圖/p7.png", name: "" },

 


 
 

];

/* =========================
   顯示圖片
========================= */

const imageGrid =
  document.getElementById("imageGrid");


images.forEach(item => {

  // 建立卡片
  const card = document.createElement("div");
  card.className = "imageCard";

  // 建立圖片
  const img = document.createElement("img");
  img.className = "galleryImage";
  img.src = item.src;
  img.alt = item.name;

  // 點擊圖片放大
  img.onclick = () => {
    showImage(item.src);
  };

  // 建立圖片名稱
  const name = document.createElement("div");
  name.className = "imageName";
  name.textContent = item.name;

  // 加入卡片
  card.appendChild(img);
  card.appendChild(name);
  imageGrid.appendChild(card);

});

/* =========================
   放大圖片
========================= */

function showImage(src){

  const viewer =
    document.getElementById("imageViewer");

  const image =
    document.getElementById("viewerImage");

  image.src=src;

  viewer.style.display="flex";

}


/* =========================
   關閉
========================= */

function closeImage(){

  document.getElementById(
    "imageViewer"
  ).style.display="none";

}


/* ESC 關閉 */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Escape"){

      closeImage();

    }

  }
);

</script>

</body>

</html>
